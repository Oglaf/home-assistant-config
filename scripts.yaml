turn_on_off_christian_pc:
  alias: Turn on/off Christian-PC
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.christian_pc
      state: 'on'
    then:
    - data: {}
      action: shell_command.christian_pc_shutdown
    else:
    - data: {}
      action: switch.turn_on
      target:
        entity_id: switch.christian_pc_wol
  mode: single
turn_on_off_christian_nb:
  alias: Turn on/off Christian-NB
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.christian_nb
      state: 'on'
    then:
    - service: shell_command.christian_nb_shutdown
      data: {}
    else:
    - service: switch.turn_on
      data: {}
      target:
        entity_id: switch.christian_nb_wol
  mode: single
delete_orphaned_database_entities:
  alias: Delete orphaned database entities
  sequence:
  - action: homeassistant.list_orphaned_database_entities
    response_variable: orphaned
  - action: recorder.purge_entities
    target:
      entity_id: '{{ orphaned.entities }}'
    data:
      keep_days: 0
  mode: single
  description: ''
vacuum_clean_segments:
  alias: VACUUM - Clean segments (shared)
  description: Cleans the given room segment IDs on the Q7 Max. Used by the daily and office scripts.
  fields:
    segments:
      description: List of Roborock segment IDs
      example: '[18, 19]'
    repeat:
      description: Number of cleaning passes
      default: 1
  sequence:
  - action: vacuum.send_command
    target:
      entity_id: vacuum.q7_max
    data:
      command: app_segment_clean
      params:
      - segments: '{{ segments }}'
        repeat: '{{ repeat | default(1) | int }}'
  - action: vacuum.set_fan_speed
    target:
      entity_id: vacuum.q7_max
    data:
      fan_speed: balanced
  - action: select.select_option
    target:
      entity_id: select.q7_max_mop_intensity
    data:
      option: 'off'
  mode: single
  icon: mdi:robot-vacuum
vacuum_daily_routine:
  alias: VACUUM - Daily routine
  sequence:
  - action: script.vacuum_clean_segments
    data:
      segments: [18, 19, 20, 21, 22, 23, 25]
      repeat: 1
  mode: single
vacuum_room_cleaning:
  alias: VACUUM - Room Cleaning
  sequence:
  - action: vacuum.send_command
    target:
      entity_id: vacuum.q7_max
    data:
      command: app_segment_clean
      params:
      - repeat: "{{ states('input_number.vacuum_cycles') | int }}"
        segments: >-
          {% set ns = namespace(ids=[]) %}
          {% for room in state_attr('sensor.roborock_rooms', 'rooms') %}
            {% if is_state(room.boolean, 'on') %}
              {% set ns.ids = ns.ids + [room.id | int] %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
  - action: vacuum.set_fan_speed
    target:
      entity_id: vacuum.q7_max
    data:
      fan_speed: "{{ states('input_select.vacuum_speed') | lower }}"
  description: ''
  icon: mdi:texture-box
  mode: single
vacuum_office_cleaning:
  alias: VACUUM - Office cleaning
  sequence:
  - action: script.vacuum_clean_segments
    data:
      segments: [24]
      repeat: 1
  description: ''
  mode: single
